name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: main
  workflow_dispatch:
    inputs:
      operating_systems:
        description: 'Operating systems to test on'
        type: choice
        default: 'all'
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
        env:
          MATRIX: >-
            ${{ 
              github.event_name == 'workflow_dispatch' && inputs.operating_systems != 'all'
              ? format('["{0}"]', inputs.operating_systems)
              : '["ubuntu-latest", "windows-latest", "macos-latest"]'
            }}

  tests:
    permissions:
      contents: write
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create uv virtualenv
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install --upgrade pip
          uv pip install -e .

      - name: Run tests
        run: uv run pytest
