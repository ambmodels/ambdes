name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13.13"
          enable-cache: true

      - name: Create uv virtualenv
        run: uv venv

      - name: Install dependencies
        run: |
          uv pip install --upgrade pip
          uv pip install -e .

      - name: Run tests
        run: uv run pytest