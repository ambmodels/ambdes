repos:
  - repo: local
    hooks:
      - id: forbid-private-path
        name: Block private data path
        entry: bash -c 'git diff --cached -- . ":(exclude).pre-commit-config.yaml" | grep -q "Time_Data_DES.csv" && exit 1 || exit 0'
        language: system
        pass_filenames: false
        stages: [pre-commit]